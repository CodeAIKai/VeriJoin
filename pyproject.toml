[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verijoin"
version = "0.1.0"
description = "Lineage-constrained execution for multi-hop question answering"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
  "torch>=2.4",
  "transformers>=4.48",
  "peft>=0.14",
  "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
verijoin = "verijoin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv-infer"]
